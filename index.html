<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1400, initial-scale=1.0">
<title>ФК Баранда — избор сезоне</title>

<!-- ==================== GOOGLE ANALYTICS 4 ====================
Исти Measurement ID као у season-template/index.html - упиши га на оба
места (овде и у "мастер" шаблону сезоне) и уклони коментар.

<script src="seasons.js" onerror="window.__seasonsLoadError=true"></script>
<style>
:root{
  --purple:#37003c; --purple2:#5a1a63; --pink:#e90052; --cyan:#04b8d6;
  --bg:#f2eef4; --panel:#ffffff; --border:#e2d9e6; --text:#20051f; --text-faint:#7a6d7e;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;}
.hero{background:linear-gradient(135deg,var(--purple),var(--purple2));padding:3rem 1.5rem 4rem;text-align:center;
  border-bottom:4px solid var(--pink);}
.hero img{width:88px;height:88px;border-radius:50%;background:#fff;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,0.25);}
.hero h1{color:#fff;font-size:1.9rem;margin:1rem 0 0.3rem;}
.hero p{color:#e8c7ee;margin:0;font-size:1rem;}
.wrap{max-width:960px;margin:-2.4rem auto 3rem;padding:0 1.5rem;}
.season-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;}
.season-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:1.6rem;
  text-decoration:none;color:var(--text);box-shadow:0 4px 14px rgba(55,0,60,0.08);
  transition:transform .15s ease, box-shadow .15s ease;display:flex;flex-direction:column;gap:0.4rem;}
.season-card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(55,0,60,0.16);}
.season-card .icon{font-size:2.2rem;}
.season-card .label{font-size:1.15rem;font-weight:800;color:var(--purple);}
.season-card .sub{font-size:0.85rem;color:var(--text-faint);}
.season-card .cta{margin-top:0.6rem;font-size:0.85rem;font-weight:700;color:var(--pink);}
.empty, .error{max-width:640px;margin:2rem auto;padding:1.5rem;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;text-align:center;color:var(--text-faint);}
.error code{background:var(--bg);padding:0.15rem 0.4rem;border-radius:6px;}
</style>
</head>
<body>
  <div class="hero">
    <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48Y2lyY2xlIGN4PSI1MCIgY3k9IjUwIiByPSI0OCIgZmlsbD0iIzM3MDAzYyIvPjx0ZXh0IHg9IjUwIiB5PSI2NSIgZm9udC1zaXplPSI0OCIgZm9udC13ZWlnaHQ9ImJvbGQiIGZpbGw9IiNlOTAwNTIiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJzYW5zLXNlcmlmIj5CPC90ZXh0Pjwvc3ZnPg==" alt="ФК Баранда">
    <h1>ФК Баранда</h1>
    <p>Изабери сезону да видиш статистику</p>
  </div>
  <div class="wrap">
    <div id="seasonList"></div>
  </div>

<script>
function renderSeasons(){
  const container = document.getElementById('seasonList');
  if(window.__seasonsLoadError){
    container.innerHTML = `<div class="error">
      <p><b>Фајл <code>seasons.js</code> није пронађен.</b></p>
      <p>Покрени <code>update_site.py</code> у фолдеру са Excel фајловима да би се направио списак сезона, па поново отвори ову страницу.</p>
    </div>`;
    return;
  }
  const seasons = (typeof ALL_SEASONS !== 'undefined') ? ALL_SEASONS : [];
  if(!seasons.length){
    container.innerHTML = `<div class="empty">
      <p>Још увек нема ниједне сезоне.</p>
      <p>Убаци Excel фајлове за прву сезону и покрени <code>update_site.py</code>.</p>
    </div>`;
    return;
  }
  // најновије сезоне прве (update_site.py их уписује хронолошки, овде их само обрнемо)
  const ordered = [...seasons].reverse();
  container.innerHTML = `<div class="season-grid">
    ${ordered.map(s=>`
      <a class="season-card" href="${s.path}index.html">
        <div class="icon">${s.icon||'🏆'}</div>
        <div class="label">${s.label}</div>
        ${s.dateFrom && s.dateTo ? `<div class="sub">${s.dateFrom} — ${s.dateTo}</div>` : ''}
        <div class="cta">Отвори статистику →</div>
      </a>`).join('')}
  </div>`;
}
renderSeasons();
</script>
</body>
</html>
